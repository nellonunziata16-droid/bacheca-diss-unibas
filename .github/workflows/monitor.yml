name: Controllo Bacheca Unibas

on:
  schedule:
    # Esegue il controllo ogni 30 minuti
    - cron: '*/30 * * * *'
  workflow_dispatch: # Permette l'avvio manuale di test

jobs:
  check-bacheca:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: pip install requests beautifulsoup4

      - name: Esegui Scraper
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python scraper.py

      - name: Salva stato memoria
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add avvisi_visti.txt || true
          git commit -m "Aggiornamento lista avvisi visti" || true
          git push || true
